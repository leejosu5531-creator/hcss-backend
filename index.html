<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 1200px; margin: auto; }

    /* 입력 양식 스타일 */
    .form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .input-label { font-size: 14px; font-weight: bold; color: #495057; white-space: nowrap; }
    input[type="date"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 140px; }
    input[type="number"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 70px; text-align: center; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; margin-bottom: 15px; }

    .button-row { display: flex; gap: 8px; }
    button { padding: 6px 14px; font-size: 13px; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; flex: 0 0 auto; min-width: 0; }
    button:disabled { background: #99c2ff; cursor: not-allowed; }
    button.secondary { background: #6c757d; flex: 0 0 auto; min-width: 0; }

    .info-box { background: #e7f5ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #74c0fc; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.8; }
    .seat-row h4 { margin: 0 0 8px 0; color: #333; font-size: 15px; }

    /* 파트별 색상 (텍스트 목록) */
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #e83e8c; font-weight: bold; }

    .person-tag { display: inline; }

    /* 배치도 + 요약을 나란히(넓은 화면) 또는 위아래로(좁은 화면) 배치 */
    .result-layout { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
    .stage-wrap { flex: 1 1 auto; min-width: 0; }
    .stage-wrap h3 { font-size: 15px; margin: 0 0 10px 0; color: #333; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .header-summary { font-size: 15px; font-weight: 500; color: #495057; }
    .header-summary .part-num { font-weight: 800; }
    .header-summary .sd-count { color: #d97706; font-weight: 800; }

    /* 좌석 배치도(리서) 시각화 */
    .stage { display: flex; flex-direction: column; gap: 10px; background: #fafafa; border: 1px solid #e9ecef; border-radius: 10px; padding: 14px 10px; }
    .stage-row { display: flex; align-items: center; gap: 8px; }
    .stage-row-label { width: 62px; flex-shrink: 0; font-size: 12px; font-weight: 800; color: #333; text-align: center; white-space: nowrap; }
    .stage-row-label .row-count { font-size: 10px; font-weight: 800; color: #0b5ed7; }
    .stage-seats { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; justify-content: center; }
    .seat { padding: 4px 8px; border-radius: 5px; font-size: 13px; color: white; white-space: nowrap; }
    .seat.S { background: #d9534f; color: white; }
    .seat.A { background: #28a745; color: white; }
    .seat.T { background: #007bff; color: white; }
    .seat.B { background: #6f42c1; color: white; }
    .seat.ORG { background: #e83e8c; color: white; }
    .seat.SD { background: #d97706; color: white; }
     .seat.EMPTY { visibility: hidden; }
    .stage-row.stage-row-sd { margin-top: 4px; padding-top: 10px; border-top: 1px dashed #dee2e6; }
    .stage-row-sd .stage-seats { justify-content: flex-start; }
    .stage-empty { color: #adb5bd; font-size: 12px; }
    .stage-front-label { text-align: center; font-size: 11px; color: #adb5bd; margin-top: 6px; }

    @media (min-width: 700px) {
      .card { max-width: 1200px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; max-width: 100%; }
    }
  
    .edit-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
    .edit-toolbar button{padding:7px 12px}
    .edit-status{display:none;margin:8px 0;padding:9px 11px;border-radius:7px;background:#fff3cd;color:#664d03;font-size:13px}
    .edit-status.on{display:block}
    .drag-stage{margin-top:10px}
    .drag-row{margin:12px 0;padding:10px;background:#f1f3f5;border-radius:9px}
    .drag-row-title{font-weight:800;margin-bottom:7px}
    .drag-zone{display:flex;flex-wrap:wrap;gap:5px;min-height:42px}
    .drag-seat{width:60px;min-height:42px;padding:5px 4px;box-sizing:border-box;border-radius:6px;
      display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;
      line-height:1.1;
      font-weight:700;background:#fff;border:1px solid #ced4da;user-select:none;touch-action:none}
    .drag-seat.S{background:#fff3a6;border-color:#e0c400}
    .drag-seat.A{background:#f6b26b;border-color:#d88a2d}
    .drag-seat.T{background:#9fc5e8;border-color:#5b9bd5}
    .drag-seat.B{background:#b6d7a8;border-color:#6aa84f}
    .drag-seat.ORG{background:#eee;color:#555;cursor:not-allowed}
    .drag-seat.empty{background:#fff;border:1px dashed #bbb;color:#aaa}
    .drag-seat.draggable{cursor:grab}
    .drag-seat.dragging{opacity:.45}
    .drag-seat.valid-target{outline:3px solid #20c997;outline-offset:1px}
    .drag-help{font-size:12px;color:#666;margin-top:8px}
    @media(max-width:600px){.drag-seat{width:56px;min-height:40px;font-size:10px;padding:5px 3px}.drag-zone{gap:4px}.drag-row{overflow-x:auto}}


.seat-card{min-width:82px!important;width:82px!important;min-height:58px!important;
padding:8px 6px!important;font-size:15px!important;line-height:1.25!important;
font-weight:700!important;white-space:normal!important;overflow-wrap:anywhere!important}
.seat-card .name,.seat-card .person-name{font-size:15px!important;font-weight:700!important}
@media(max-width:700px){.seat-card{min-width:74px!important;width:74px!important;font-size:14px!important}}
button:disabled,.btn-disabled{opacity:.42!important;cursor:not-allowed!important;filter:grayscale(65%)}
.btn-ready{box-shadow:0 0 0 2px rgba(25,135,84,.18);font-weight:800}
.btn-active{box-shadow:0 0 0 2px rgba(13,110,253,.25);font-weight:800}
.btn-done{opacity:.8;font-weight:800}
.summary-line{margin:0 0 6px 0;line-height:1.9}
.summary-line .sep{color:#adb5bd;margin:0 5px}
.summary-line .grp{margin-right:22px;white-space:normal}
.summary-warn{margin:6px 0 0 0;color:#b45309;font-weight:700;font-size:13px}
.sd-row{background:#fff7e6;border:1px dashed #f0a020}
.drag-seat.fixed{cursor:default}
</style>

<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group no-print">
      <input type="date" id="dateInput">
      <span class="input-label">찬양대석 정원</span>
      <input type="number" id="seatsInput" value="67" min="1" max="70" step="1" inputmode="numeric">
    </div>
    <div class="checkbox-group no-print">
      <input type="checkbox" id="forceRefreshInput">
      <label for="forceRefreshInput">출석부 새로고침 (엑셀을 방금 수정했다면 체크)</label>
    </div>
    <div class="button-row no-print">
      <button id="runBtn" onclick="run()">좌석 자동배치 실행</button><button class="secondary" id="loadBtn" onclick="loadSavedLayout(true)">☁️ 저장된 배치 불러오기</button>
      <button class="secondary" id="printBtn" onclick="window.print()" disabled>인쇄</button>
    </div>

    <div class="edit-toolbar no-print">
  <button id="editBtn" class="secondary" onclick="startEdit()" disabled>✋ 수동 좌석조정</button>
  <button id="resetEditBtn" class="secondary" onclick="resetEdit()" disabled>↩ 자동배치로 되돌리기</button>
  <button id="finishEditBtn" onclick="finishEdit()" disabled>✅ 조정 완료</button>
</div>
<div id="editStatus" class="edit-status no-print"></div>
<div id="result" style="margin-top:20px;">
  <div id="summaryBox"></div>
  <div id="stageBox"></div>
  <div id="diagBox"></div>
</div>
  </div>

  
<script>
const API_URL = "https://hcss-backend.onrender.com/api/allocate";

let serverRows = null;
let manualRows = null;
let editing = false;
let dragSource = null;
let pointerSource = null;
let longPressTimer = null;
let currentMeta = null;
let savedLayoutAt = null;
let summaryData = null;      // 서버가 준 출석 정보(날짜/총출석/파트별 출석/성도석)
let loadSeq = 0;             // 저장배치 불러오기 요청 번호(오래된 응답 무시용)
let loadAbort = null;        // 진행 중인 불러오기 요청 취소용
let loadDebounce = null;

const API_BASE = API_URL.replace(/\/+$/,"").replace(/\/api\/allocate$/,"");
const MAX_SEATS = 70;        // 서버 열별 최대 좌석 18+18+17+17 (main.py 의 ROW_CAPS 와 같아야 함)
const DEFAULT_SEATS = 67;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* 좌석 정원: 비었거나 이상한 값이면 67, 범위는 1~70 로 보정 */
function getSeats(){
  const el=document.getElementById("seatsInput");
  let n=parseInt(el.value,10);
  if(!Number.isFinite(n)) n=DEFAULT_SEATS;
  n=Math.min(MAX_SEATS,Math.max(1,n));
  if(String(n)!==el.value) el.value=n;
  return n;
}

/*
 * 서버 호출 공통 함수.
 * Render 무료 서버는 잠들어 있다가 깨어나는 동안(30~60초) 연결 실패/502/503이 나오는데,
 * 브라우저에는 이것이 "Failed to fetch"로만 보인다. 그래서 네트워크 오류/시간초과/502~504는
 * 자동으로 다시 시도하고, 서버가 알려준 오류(400/500 등)는 그대로 보여준다.
 */
async function callApi(path, {method="POST", body=null, timeout=45000, retries=2, signal=null, onRetry=null}={}){
  let lastErr=null;
  for(let attempt=0; attempt<=retries; attempt++){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeout);
    const onOuterAbort=()=>controller.abort();
    if(signal){
      if(signal.aborted){ clearTimeout(timer); throw new DOMException("cancelled","AbortError"); }
      signal.addEventListener("abort",onOuterAbort,{once:true});
    }
    try{
      const opts={method,mode:"cors",headers:{"Accept":"application/json"},signal:controller.signal};
      if(body!==null){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
      const response=await fetch(API_BASE+path,opts);
      const text=await response.text();
      let data=null; try{ data=JSON.parse(text); }catch(_){}
      if([502,503,504].includes(response.status)){
        lastErr=new Error("서버가 아직 준비되지 않았습니다.");
        lastErr.retryable=true;
      }else if(!response.ok){
        const e=new Error((data&&data.detail)||`서버 오류 (${response.status})`);
        e.retryable=false; throw e;
      }else if(data===null){
        const e=new Error("서버 응답 형식 오류"); e.retryable=false; throw e;
      }else{
        return data;
      }
    }catch(e){
      if(signal&&signal.aborted) throw new DOMException("cancelled","AbortError"); // 사용자가 취소/교체한 요청
      if(e.retryable===false) throw e;
      lastErr=e;
      lastErr.retryable=true;               // TypeError(Failed to fetch), 시간초과
    }finally{
      clearTimeout(timer);
      if(signal) signal.removeEventListener("abort",onOuterAbort);
    }
    if(attempt<retries){
      if(onRetry) onRetry(attempt+1,retries);
      await sleep(3000*(attempt+1));
    }
  }
  throw friendlyError(lastErr);
}

function friendlyError(e){
  if(!e) return new Error("알 수 없는 오류");
  if(e.name==="AbortError") return new Error("서버 응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.");
  if(e instanceof TypeError) return new Error("서버에 연결하지 못했습니다. 서버가 깨어나는 중이거나 네트워크 문제일 수 있습니다. 1분쯤 뒤에 다시 눌러 주세요.");
  return e;
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cloneRows(rows){
  return (rows || []).map(row => (row || []).map(x => [x[0],x[1]]));
}

function setEditButtons(hasData){
  const a=document.getElementById("editBtn");
  const b=document.getElementById("resetEditBtn");
  const c=document.getElementById("finishEditBtn");
  if(a) a.disabled=!hasData;
  if(b) b.disabled=!hasData;
  if(c) c.disabled=!editing;
}

function status(msg,on=true){
  const el=document.getElementById("editStatus");
  el.textContent=msg;
  el.classList.toggle("on",on);
}

/*
 * 서버의 rows는 실제 좌석 순서(B-A-S-T / B-T 등)를 그대로 사용한다.
 * 따라서 자동배치 결과의 물리 좌우 방향을 다시 뒤집지 않는다.
 */
function countRows(rows){
  return (rows||[]).map(row=>{
    const c={S:0,A:0,T:0,B:0,ORG:0};
    (row||[]).forEach(it=>{ if(it && c[it[0]]!==undefined) c[it[0]]++; });
    return c;
  });
}

/* 성도석으로 이동한 인원 목록 [["A","이름"],...] (서버가 준 sungdoseok 를 펼친 것) */
function sdList(data){
  const sd=(data&&data.sungdoseok)||{};
  const out=[];
  ["S","A","T","B"].forEach(k=>(sd[k]||[]).forEach(n=>out.push([k,n])));
  return out;
}

/*
 * 요약 표시:  파트 출석 : S 25, A 17, T 12, B 15    열별 배치 : 1열 S10, A7 / 2열 S10, A7 / ...
 * 열별 인원은 화면의 좌석(rows)을 기준으로 다시 세므로, 수동 조정 후에도 바로 반영된다.
 */
function buildCountSummary(data,rows){
  data=data||{};
  const p=data.attending_by_part||{};
  const att=data.attending_count!=null?data.attending_count:((p.S||0)+(p.A||0)+(p.T||0)+(p.B||0));
  const rc=countRows(rows);
  const tok=(k,txt)=>`<span class="${k}">${txt}</span>`;

  const partTxt=["S","A","T","B"].map(k=>tok(k,`${k} ${p[k]||0}`)).join(", ");
  const rowTxt=rc.map((r,i)=>{
    const items=["S","A","T","B"].filter(k=>r[k]).map(k=>tok(k,`${k}${r[k]}`));
    if(r.ORG) items.push(tok("ORG","오르간"));
    return `${i+1}열 ${items.join(", ")||"-"}`;
  }).join('<span class="sep">/</span>');

  let h=`<div class="info-box">`;
  h+=`<p style="margin:0 0 6px 0"><strong>📅 기준 날짜:</strong> ${esc(data.date||"")}</p>`;
  h+=`<p style="margin:0 0 6px 0"><strong>👥 총 출석:</strong> ${att}명 + 오르간 1석 = ${att+1}명</p>`;
  h+=`<p class="summary-line"><span class="grp"><strong>파트 출석 :</strong> ${partTxt}</span>`+
     `<span class="grp"><strong>열별 배치 :</strong> ${rowTxt}</span></p>`;

  const sd=sdList(data);
  if(sd.length){
    const cnt={}; sd.forEach(([k])=>cnt[k]=(cnt[k]||0)+1);
    const cntTxt=["S","A","T","B"].filter(k=>cnt[k]).map(k=>tok(k,`${k} ${cnt[k]}명`)).join(", ");
    h+=`<p class="summary-warn">⚠ 정원 초과로 성도석 이동 : ${cntTxt}</p>`;
  }
  h+=`</div>`;
  return h;
}

function renderSummary(rows){
  const box=document.getElementById("summaryBox");
  box.innerHTML = summaryData ? buildCountSummary(summaryData,rows) : "";
}

/* 안내/오류 메시지 표시 (요약과 배치도는 비운다) */
function showMessage(html){
  document.getElementById("summaryBox").innerHTML="";
  document.getElementById("stageBox").innerHTML=html;
  document.getElementById("diagBox").innerHTML="";
}

function renderEditable(rows){
  const result=document.getElementById("stageBox");
  if(!rows) return;
  renderSummary(rows);

  let html='<div class="drag-stage">';
  rows.forEach((row,r)=>{
    html += `<div class="drag-row">
      <div class="drag-row-title">[${r+1}열] (${row.length}명)</div>
      <div class="drag-zone" data-row="${r}">`;

    row.forEach((item,i)=>{
      const part=item[0], name=item[1];
      const org=part==="ORG";
      html += `<div class="drag-seat ${esc(part)} ${org?'':'draggable'}"
        data-row="${r}" data-index="${i}" ${org?'':'draggable="true"'}>
        ${org ? '↑ 오르간' : esc(name)}
      </div>`;
    });

    html += '</div></div>';
  });
  const sd=sdList(summaryData);
  if(sd.length){
    html += `<div class="drag-row sd-row">
      <div class="drag-row-title">[성도석] 정원 초과로 이동 (${sd.length}명)</div>
      <div class="drag-zone">`;
    sd.forEach(([part,name])=>{
      html += `<div class="drag-seat ${esc(part)} fixed">${esc(name)}</div>`;
    });
    html += `</div></div>`;
  }
  html += `<div class="drag-help">
    ${editing
      ? '드래그하여 좌석을 교환할 수 있습니다. 수동조정에서는 다른 파트로도 이동할 수 있으며, 오르간석은 고정입니다.'
      : '자동배치 결과입니다. 「수동 좌석조정」을 누르면 이름을 드래그하여 같은 파트 또는 다른 파트 좌석으로 이동할 수 있습니다.'}
  </div></div>`;

  result.innerHTML=html;
  if(editing) bindDnD();
}

function getItem(r,i){
  return manualRows?.[r]?.[i] || null;
}

function validMove(fr,fi,tr,ti){
  const a=getItem(fr,fi), b=getItem(tr,ti);
  if(!a || !b) return false;
  if(a[0]==="ORG" || b[0]==="ORG") return false;
  return !(fr===tr && fi===ti);
}

function clearHighlights(){
  document.querySelectorAll(".drag-seat").forEach(el=>{
    el.classList.remove("valid-target","dragging");
  });
}

function highlight(){
  clearHighlights();
  if(!dragSource) return;
  document.querySelectorAll(".drag-seat").forEach(el=>{
    const r=+el.dataset.row, i=+el.dataset.index;
    if(validMove(dragSource.r,dragSource.i,r,i))
      el.classList.add("valid-target");
  });
}

function exchange(fr,fi,tr,ti){
  if(!validMove(fr,fi,tr,ti)){
    status("⚠ 오르간석을 제외한 좌석끼리만 교환할 수 있습니다.");
    return;
  }
  const tmp=manualRows[fr][fi];
  manualRows[fr][fi]=manualRows[tr][ti];
  manualRows[tr][ti]=tmp;
  renderEditable(manualRows);
  status("✏️ 좌석을 교환했습니다.");
}

function bindDnD(){
  document.querySelectorAll('.drag-seat[draggable="true"]').forEach(el=>{
    el.addEventListener("dragstart",e=>{
      dragSource={r:+el.dataset.row,i:+el.dataset.index};
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain","HCSS");
      highlight();
    });
    el.addEventListener("dragend",()=>{
      clearHighlights();
      dragSource=null;
    });
    el.addEventListener("dragover",e=>{
      if(!dragSource) return;
      const r=+el.dataset.row,i=+el.dataset.index;
      if(validMove(dragSource.r,dragSource.i,r,i)){
        e.preventDefault();
        el.classList.add("valid-target");
      }
    });
    el.addEventListener("drop",e=>{
      e.preventDefault();
      if(!dragSource) return;
      const from={...dragSource};
      exchange(from.r,from.i,+el.dataset.row,+el.dataset.index);
      clearHighlights();
      dragSource=null;
    });

    // 모바일: 길게 누른 뒤 목적지 좌석을 터치하면 교환
    el.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse") return;
      pointerSource={r:+el.dataset.row,i:+el.dataset.index};
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(()=>{
        dragSource=pointerSource;
        highlight();
        status("📱 이동할 좌석을 터치하세요.");
      },350);
    });
  });
}

document.addEventListener("pointerup",e=>{
  clearTimeout(longPressTimer);
  if(e.pointerType==="mouse" || !dragSource) return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.(".drag-seat");
  const from={...dragSource};
  if(target) exchange(from.r,from.i,+target.dataset.row,+target.dataset.index);
  clearHighlights();
  dragSource=null;
  pointerSource=null;
});

async function saveLayoutToServer(){
  if(!manualRows || !currentMeta) return;
  const data=await callApi("/api/layout/save",{
    body:{date_str:currentMeta.date_str,total_seats:currentMeta.total_seats,rows:manualRows},
    timeout:60000,retries:1,
    onRetry:()=>status("☁️ 서버가 깨어나는 중입니다. 저장을 다시 시도합니다...")
  });
  savedLayoutAt=data.saved_at||null;
  return data;
}

/* 저장된 배치 불러오기. 연속 호출(날짜/정원 변경, 버튼 클릭)되면 이전 요청은 취소하고 마지막 요청만 처리한다. */
async function loadSavedLayout(showStatus=true){
  const date=document.getElementById("dateInput").value;
  const seats=getSeats();
  const mySeq=++loadSeq;
  if(loadAbort) loadAbort.abort();
  const controller=new AbortController();
  loadAbort=controller;
  try{
    if(showStatus) status("☁️ 저장된 배치를 확인하는 중...");
    const data=await callApi("/api/layout/load",{
      body:{date_str:date,total_seats:seats,rows:[]},
      timeout:45000,retries:2,signal:controller.signal,
      onRetry:(n,max)=>{ if(showStatus) status(`☁️ 서버가 깨어나는 중입니다. 다시 연결합니다... (${n}/${max})`); }
    });
    if(mySeq!==loadSeq) return false;               // 더 최근 요청이 있으면 이 응답은 버린다
    if(data.status==="success"&&data.rows){
      currentMeta={date_str:date,total_seats:seats};
      serverRows=cloneRows(data.rows); manualRows=cloneRows(data.rows);
      editing=false; savedLayoutAt=data.saved_at||null;
      summaryData=data;
      setEditButtons(true);
      document.getElementById("printBtn").disabled=false;
      document.getElementById("diagBox").innerHTML="";
      renderEditable(serverRows);
      if(showStatus) status("☁️ 저장된 배치를 불러왔습니다.");
      return true;
    }
    if(data.status==="not_found"){
      if(showStatus) status("저장된 배치가 없습니다. 먼저 「조정 완료」로 저장해 주세요.",true);
      return false;
    }
    throw new Error(data.detail||"저장된 배치를 불러오지 못했습니다.");
  }catch(e){
    if(e&&e.name==="AbortError" && mySeq!==loadSeq) return false;  // 새 요청으로 교체된 경우
    console.error(e);
    if(showStatus) status(`❌ 저장된 배치 불러오기 실패: ${e.message}`,true);
    return false;
  }finally{
    if(loadAbort===controller) loadAbort=null;
  }
}
function startEdit(){
  if(!serverRows) return;
  editing=true;
  manualRows=cloneRows(serverRows);
  setEditButtons(true);
  status("✋ 수동 좌석조정 모드입니다.");
  renderEditable(manualRows);
}

function resetEdit(){
  if(!serverRows) return;
  editing=true;
  manualRows=cloneRows(serverRows);
  status("↩ 자동배치 결과로 되돌렸습니다.");
  renderEditable(manualRows);
}

async function finishEdit(){
  if(!manualRows) return;
  try{
    await saveLayoutToServer();
    editing=false;
    serverRows=cloneRows(manualRows);
    setEditButtons(true);
    status(`✅ 수동 좌석조정 완료 · Google에 저장되었습니다${savedLayoutAt?` (${new Date(savedLayoutAt).toLocaleString("ko-KR")})`:""}`);
    renderEditable(serverRows);
  }catch(e){ status(`❌ 저장 실패: ${e.message}`); }
}

async function run(){
  const runBtn=document.getElementById("runBtn");
  const printBtn=document.getElementById("printBtn");
  const selectedDate=document.getElementById("dateInput").value;
  const totalSeats=getSeats();
  const forceRefresh=document.getElementById("forceRefreshInput").checked;

  // 진행 중인 자동 불러오기가 있으면 취소 (결과 화면을 덮어쓰지 않도록)
  loadSeq++; if(loadAbort) loadAbort.abort();

  try{ localStorage.setItem("lastTotalSeats",String(totalSeats)); }catch(_){}
  runBtn.disabled=true;
  printBtn.disabled=true;
  setEditButtons(false);
  status("",false);
  summaryData=null;
  showMessage("<p style='color:#007bff;font-weight:bold;'>구글 시트에서 출석부를 읽어 좌석을 배치 중입니다...</p>");

  try{
    const data=await callApi("/api/allocate",{
      body:{
        date_str:selectedDate,
        total_seats:totalSeats,
        balance_rule:"1=2>=3>=4",
        force_refresh:forceRefresh
      },
      timeout:90000,retries:1,
      onRetry:()=>showMessage("<p style='color:#007bff;font-weight:bold;'>서버가 깨어나는 중입니다. 잠시만 기다려 주세요...</p>")
    });

    serverRows=cloneRows(data.rows);
    manualRows=cloneRows(data.rows);
    editing=false;
    currentMeta={date_str:selectedDate,total_seats:totalSeats};
    savedLayoutAt=null;
    summaryData=data;

    renderEditable(serverRows);     // 요약(총 출석/파트 출석/열별 배치)도 함께 그린다

    // 기존 프로그램의 진단 정보
    if(data.code_version || data.data_source){
      let diag="";
      if(data.data_source) diag += `${esc(data.data_source)} (${data.refresh_mode==="force"?"새로고침":"캐시"})`;
      if(data.code_version) diag += (diag?" · ":"")+`서버 버전: ${esc(data.code_version)}`;
      document.getElementById("diagBox").innerHTML=
        `<p class="no-print" style="margin-top:10px;font-size:10px;color:#adb5bd;text-align:right">${diag}</p>`;
    }

    printBtn.disabled=false;
    setEditButtons(true);
    status("자동배치 완료. 필요하면 「수동 좌석조정」을 눌러 드래그하세요.");
  }catch(error){
    showMessage(`<p style="color:red"><strong>오류:</strong> ${esc(error.message)}</p>`);
    setEditButtons(false);
  }finally{
    runBtn.disabled=false;
    runBtn.textContent="좌석 자동배치 실행";
  }
}
document.addEventListener("DOMContentLoaded",()=>{
  const d=document.getElementById("dateInput");
  const s=document.getElementById("seatsInput");
  if(!d.value){ const x=new Date(); d.value=x.toISOString().slice(0,10); }

  // 지난번에 쓴 정원을 복원 (없으면 HTML 기본값 67)
  try{
    const saved=parseInt(localStorage.getItem("lastTotalSeats"),10);
    if(Number.isFinite(saved) && saved>=1 && saved<=MAX_SEATS) s.value=saved;
  }catch(_){}

  // 정원 칸이 비어 있으면 위/아래 화살표가 0에서 시작해 1/-1이 되므로, 항상 유효한 값을 유지한다.
  s.addEventListener("blur",()=>{ getSeats(); });

  // 화살표를 연타해도 서버 호출은 마지막 값 기준으로 한 번만 보낸다.
  const scheduleLoad=()=>{
    clearTimeout(loadDebounce);
    getSeats();
    loadDebounce=setTimeout(()=>loadSavedLayout(true),700);
  };
  d.addEventListener("change",scheduleLoad);
  s.addEventListener("change",scheduleLoad);

  loadSavedLayout(false);
});
</script>
