<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; flex: 1; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.6; }
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #fd7e14; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group">
      <input type="date" id="dateInput" style="flex:2;">
      <input type="number" id="seatsInput" value="67" style="flex:1;">
    </div>
    <!-- onclick 함수 이름을 run으로 수정 -->
    <button onclick="run()">좌석 자동배치 실행</button>
    
    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    // 페이지 접속 시 오늘 날짜를 YYYY-MM-DD 형식으로 자동 지정
    document.getElementById("dateInput").value = new Date().toLocaleDateString("en-CA");
    
    const API_URL = "https://hcss-backend.onrender.com/api/allocate";

    async function run() {
      const resultDiv = document.getElementById("result");
      
      // 사용자가 입력창에서 선택한 날짜와 좌석 수를 읽어옵니다.
      const selectedDate = document.getElementById("dateInput").value;
      const totalSeats = parseInt(document.getElementById("seatsInput").value) || 67;

      resultDiv.innerText = "좌석 배치를 진행 중입니다... (약 10~30초 소요될 수 있습니다)";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            date_str: selectedDate, // 사용자가 입력한 날짜 동적 전송
            total_seats: totalSeats  // 사용자가 입력한 좌석 수 동적 전송
          })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `
            <div style="background: #e7f5ff; padding: 15px; border-radius: 8px; border: 1px solid #74c0fc;">
              <p style="margin: 0 0 8px 0; color: #1971c2;"><strong>✅ 구글 드라이브 연결 완료</strong></p>
              <p style="margin: 0 0 5px 0;"><strong>선택한 날짜:</strong> ${selectedDate}</p>
              <p style="margin: 0 0 5px 0;"><strong>메시지:</strong> ${data.message}</p>
              <p style="margin: 0; font-size: 13px; color: #495057;"><strong>파일 ID:</strong> ${data.file_id}</p>
            </div>
          `;
        } else {
          resultDiv.innerText = `오류 발생: ${data.detail || "알 수 없는 오류"}`;
        }
      } catch (error) {
        resultDiv.innerText = `통신 에러: ${error.message}`;
      }
    }
  </script>
</body>
</html>
