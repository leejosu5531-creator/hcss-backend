<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 650px; margin: auto; }

    /* 입력 양식 스타일 */
    .form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .input-label { font-size: 14px; font-weight: bold; color: #495057; white-space: nowrap; }
    input[type="date"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 140px; }
    input[type="number"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 70px; text-align: center; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; margin-bottom: 15px; }

    .button-row { display: flex; gap: 8px; }
    button { padding: 6px 14px; font-size: 13px; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; flex: 0 0 auto; min-width: 0; }
    button:disabled { background: #99c2ff; cursor: not-allowed; }
    button.secondary { background: #6c757d; flex: 0 0 auto; min-width: 0; }

    .info-box { background: #e7f5ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #74c0fc; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.8; }
    .seat-row h4 { margin: 0 0 8px 0; color: #333; font-size: 15px; }

    /* 파트별 색상 (텍스트 목록) */
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #e83e8c; font-weight: bold; }

    .person-tag { display: inline; }

    /* 배치도 + 요약을 나란히(넓은 화면) 또는 위아래로(좁은 화면) 배치 */
    .result-layout { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
    .stage-wrap { flex: 1 1 auto; min-width: 0; }
    .stage-wrap h3 { font-size: 15px; margin: 0 0 10px 0; color: #333; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .header-summary { font-size: 15px; font-weight: 500; color: #495057; }
    .header-summary .part-num { font-weight: 800; }
    .header-summary .sd-count { color: #d97706; font-weight: 800; }

    /* 좌석 배치도(리서) 시각화 */
    .stage { display: flex; flex-direction: column; gap: 10px; background: #fafafa; border: 1px solid #e9ecef; border-radius: 10px; padding: 14px 10px; }
    .stage-row { display: flex; align-items: center; gap: 8px; }
    .stage-row-label { width: 44px; flex-shrink: 0; font-size: 13px; font-weight: 800; color: #333; text-align: center; }
    .stage-seats { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; justify-content: center; }
    .seat { padding: 4px 8px; border-radius: 5px; font-size: 13px; color: white; white-space: nowrap; }
    .seat.S { background: #d9534f; color: white; }
    .seat.A { background: #28a745; color: white; }
    .seat.T { background: #007bff; color: white; }
    .seat.B { background: #6f42c1; color: white; }
    .seat.ORG { background: #e83e8c; color: white; }
    .seat.SD { background: #d97706; color: white; }
    .stage-row.stage-row-sd { margin-top: 4px; padding-top: 10px; border-top: 1px dashed #dee2e6; }
    .stage-row-sd .stage-seats { justify-content: flex-start; }
    .stage-empty { color: #adb5bd; font-size: 12px; }
    .stage-front-label { text-align: center; font-size: 11px; color: #adb5bd; margin-top: 6px; }

    @media (min-width: 700px) {
      .card { max-width: 1200px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group no-print">
      <input type="date" id="dateInput">
      <span class="input-label">찬양대석 정원</span>
      <input type="number" id="seatsInput" placeholder="67">
    </div>
    <div class="checkbox-group no-print">
      <input type="checkbox" id="forceRefreshInput">
      <label for="forceRefreshInput">출석부 새로고침 (엑셀을 방금 수정했다면 체크)</label>
    </div>
    <div class="button-row no-print">
      <button id="runBtn" onclick="run()">좌석 자동배치 실행</button>
      <button class="secondary" id="printBtn" onclick="window.print()" disabled>인쇄</button>
    </div>

    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    // 오늘 날짜 기본 설정
    document.getElementById("dateInput").value = new Date().toLocaleDateString("en-CA");

    // 저장된 찬양대석 정원 불러오기 (기본값 67)
    const savedSeats = localStorage.getItem("lastTotalSeats");
    document.getElementById("seatsInput").value = savedSeats ? savedSeats : "67";

    const API_URL = "https://hcss-backend.onrender.com/api/allocate";
    const PART_LABELS = { S: "소프라노", A: "알토", T: "테너", B: "베이스" };

    function buildRowStats(row, idx) {
      const femaleOrder = ["A", "S"];
      const row3Order = ["B", "T", "S", "ORG"];  // 3열은 남녀가 섞이므로 소프라노도 포함
      const row4Order = ["B", "T", "ORG"];
      const partLabel = { A: "A", S: "S", B: "B", T: "T", ORG: "오르간" };
      const order = idx === 0 || idx === 1 ? femaleOrder : idx === 2 ? row3Order : row4Order;

      const counts = {};
      row.forEach(([part]) => { counts[part] = (counts[part] || 0) + 1; });
      const bits = order.filter(p => counts[p] > 0)
        .map(p => `<span class="part-num ${p}">${partLabel[p]}${counts[p]}</span>`);
      return `${bits.join(',')}=${row.length}`;
    }

    function buildHeaderSummary(rows, sungdoseok) {
      const rowLabels = ["1열", "2열", "3열", "4열"];
      const parts = rows.map((row, idx) => `${rowLabels[idx]} ${buildRowStats(row, idx)}`);
      const sd = sungdoseok || {};
      const sdCount = ["S", "A", "T", "B"].reduce((sum, p) => sum + (sd[p] ? sd[p].length : 0), 0);
      return parts.join(' / ') + `, 성도석 <span class="sd-count">${sdCount}</span>명`;
    }

    function renderStage(rows, sungdoseok) {
      let html = '<div class="stage">';
      // 1열(앞줄)부터 4열(뒷줄) 순서로 표시
      for (let idx = 0; idx <= 3; idx++) {
        const row = rows[idx] || [];
        html += `<div class="stage-row">`;
        html += `<span class="stage-row-label">${idx + 1}열</span>`;
        html += `<div class="stage-seats">`;
        if (row.length === 0) {
          html += `<span class="stage-empty">-</span>`;
        } else {
          row.forEach(([part, name]) => {
            const label = part === "ORG" ? "오르간" : name;
            html += `<div class="seat ${part}">${label}</div>`;
          });
        }
        html += `</div></div>`;
      }

      // 성도석: 정원 초과로 못 앉은 인원이 있으면 4열 아래에 이어서 표시
      const sd = sungdoseok || {};
      const sdNames = ["S", "A", "T", "B"].flatMap(p => (sd[p] || []).map(name => [p, name]));
      if (sdNames.length > 0) {
        html += `<div class="stage-row stage-row-sd">`;
        html += `<span class="stage-row-label">성도석</span>`;
        html += `<div class="stage-seats">`;
        sdNames.forEach(([part, name]) => {
          html += `<div class="seat SD">${name}</div>`;
        });
        html += `</div></div>`;
      }

      html += '</div><div class="stage-front-label">▲ 회중석(앞쪽) 방향</div>';
      return html;
    }

    async function run() {
      const resultDiv = document.getElementById("result");
      const runBtn = document.getElementById("runBtn");
      const printBtn = document.getElementById("printBtn");
      const selectedDate = document.getElementById("dateInput").value;
      const seatsInputVal = document.getElementById("seatsInput").value;
      const totalSeats = parseInt(seatsInputVal) || 67;
      const forceRefresh = document.getElementById("forceRefreshInput").checked;

      localStorage.setItem("lastTotalSeats", totalSeats);

      runBtn.disabled = true;
      printBtn.disabled = true;
      runBtn.textContent = "배치 중... (출석부를 불러오는 중입니다)";
      resultDiv.innerHTML = "<p style='color:#007bff; font-weight:bold;'>구글 드라이브에서 출석부를 읽어 좌석을 배치 중입니다...</p>";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date_str: selectedDate,
            total_seats: totalSeats,
            // 백엔드 균등 배정 규칙 전달 (1열=2열>=3열>=4열, 편차 1이내)
            balance_rule: "1=2>=3>=4",
            force_refresh: forceRefresh
          })
        });

        const data = await response.json();

        if (response.ok) {
          const p = data.attending_by_part || {};
          const totalWithOrgan = data.attending_count + 1;

          let html = `
            <div class="info-box">
              <p style="margin:0 0 5px 0;"><strong>📅 기준 날짜:</strong> ${data.date}</p>
              <p style="margin:0;"><strong>👥 출석인원 :</strong> 총 ${totalWithOrgan}명 (S ${p.S || 0}, A ${p.A || 0}, T ${p.T || 0}, B ${p.B || 0}, O 1)</p>
            </div>
          `;

          const sdForStage = data.sungdoseok || data.leftover || {};

          html += `<div class="result-layout">`;
          html += `<div class="stage-wrap"><h3>🪑 좌석 배치도 <span class="header-summary">${buildHeaderSummary(data.rows, sdForStage)}</span></h3>` + renderStage(data.rows, sdForStage) + `</div>`;
          html += `</div>`;

          if (data.code_version) {
            html += `<p class="no-print" style="margin-top:10px; font-size:10px; color:#ccc; text-align:right;">서버 버전: ${data.code_version}</p>`;
          }

          resultDiv.innerHTML = html;
          printBtn.disabled = false;
        } else {
          resultDiv.innerHTML = `<p style="color:red;"><strong>오류 발생:</strong> ${data.detail || "알 수 없는 오류"}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p style="color:red;"><strong>통신 에러:</strong> ${error.message}</p>`;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = "좌석 자동배치 실행";
      }
    }
  </script>
</body>
</html>
