<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치 · V3</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 1200px; margin: auto; }

    /* 입력 양식 스타일 */
    .form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .input-label { font-size: 14px; font-weight: bold; color: #495057; white-space: nowrap; }
    input[type="date"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 140px; }
    input[type="number"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 70px; text-align: center; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; margin-bottom: 15px; }

    .button-row { display: flex; gap: 8px; }
    button { padding: 6px 14px; font-size: 13px; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; flex: 0 0 auto; min-width: 0; }
    button:disabled { background: #99c2ff; cursor: not-allowed; }
    button.secondary { background: #6c757d; flex: 0 0 auto; min-width: 0; }

    .info-box { background: #e7f5ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #74c0fc; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.8; }
    .seat-row h4 { margin: 0 0 8px 0; color: #333; font-size: 15px; }

    /* 파트별 색상 (텍스트 목록) */
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #e83e8c; font-weight: bold; }

    .person-tag { display: inline; }

    /* 배치도 + 요약을 나란히(넓은 화면) 또는 위아래로(좁은 화면) 배치 */
    .result-layout { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
    .stage-wrap { flex: 1 1 auto; min-width: 0; }
    .stage-wrap h3 { font-size: 15px; margin: 0 0 10px 0; color: #333; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .header-summary { font-size: 15px; font-weight: 500; color: #495057; }
    .header-summary .part-num { font-weight: 800; }
    .header-summary .sd-count { color: #d97706; font-weight: 800; }

    /* 좌석 배치도(리서) 시각화 */
    .stage { display: flex; flex-direction: column; gap: 10px; background: #fafafa; border: 1px solid #e9ecef; border-radius: 10px; padding: 14px 10px; }
    .stage-row { display: flex; align-items: center; gap: 8px; }
    .stage-row-label { width: 62px; flex-shrink: 0; font-size: 12px; font-weight: 800; color: #333; text-align: center; white-space: nowrap; }
    .stage-row-label .row-count { font-size: 10px; font-weight: 800; color: #0b5ed7; }
    .stage-seats { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; justify-content: center; }
    .seat { padding: 4px 8px; border-radius: 5px; font-size: 13px; color: white; white-space: nowrap; }
    .seat.S { background: #ffe599; color: #5b3a00; border:1px solid #d6b656; }
    .seat.A { background: #f6b26b; color: #6b3200; border:1px solid #c97b24; }
    .seat.T { background: #9fc5e8; color: #123a63; border:1px solid #5b9bd5; }
    .seat.B { background: #b6d7a8; color: #1f4d2a; border:1px solid #6aa84f; }
    .seat.ORG { background: #e9ecef; color: #343a40; border:1px solid #adb5bd; }
    .seat.SD { background: #d97706; color: white; }
     .seat.EMPTY { visibility: hidden; }
    .stage-row.stage-row-sd { margin-top: 4px; padding-top: 10px; border-top: 1px dashed #dee2e6; }
    .stage-row-sd .stage-seats { justify-content: flex-start; }
    .stage-empty { color: #adb5bd; font-size: 12px; }
    .stage-front-label { text-align: center; font-size: 11px; color: #adb5bd; margin-top: 6px; }

    @media (min-width: 700px) {
      .card { max-width: 1200px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; max-width: 100%; }
    }
  
    .edit-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
    .edit-toolbar button{padding:7px 12px}
    .edit-status{display:none;margin:8px 0;padding:9px 11px;border-radius:7px;background:#fff3cd;color:#664d03;font-size:13px}
    .edit-status.on{display:block}
    .drag-stage{margin-top:10px}
    .drag-row{margin:12px 0;padding:10px;background:#f1f3f5;border-radius:9px}
    .drag-row-title{font-weight:800;margin-bottom:7px}
    .drag-zone{display:flex;flex-wrap:wrap;gap:5px;min-height:42px}
    .drag-seat{width:64px;min-height:44px;padding:4px 3px;box-sizing:border-box;border-radius:6px;
      display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;
      line-height:1.15;
      font-weight:700;background:#fff;border:1px solid #ced4da;user-select:none;touch-action:none}
    .drag-seat.S{background:#fff3a6;border-color:#e0c400}
    .drag-seat.A{background:#f6b26b;border-color:#d88a2d}
    .drag-seat.T{background:#9fc5e8;border-color:#5b9bd5}
    .drag-seat.B{background:#b6d7a8;border-color:#6aa84f}
    .drag-seat.ORG{background:#eee;color:#555;cursor:not-allowed}
    .drag-seat.empty{background:#fff;border:1px dashed #bbb;color:#aaa}
    .drag-seat.draggable{cursor:grab}
    .drag-seat.dragging{opacity:.45}
    .drag-seat.valid-target{outline:3px solid #20c997;outline-offset:1px}
    .drag-help{font-size:12px;color:#666;margin-top:8px}
    @media(max-width:600px){.drag-seat{width:58px;min-height:42px;font-size:11px;padding:4px 2px}.drag-zone{gap:3px}.drag-row{overflow-x:auto}}

</style>
</head>
<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group no-print">
      <input type="date" id="dateInput">
      <span class="input-label">찬양대석 정원</span>
      <input type="number" id="seatsInput" value="67" placeholder="67">
    </div>
    <div class="checkbox-group no-print">
      <input type="checkbox" id="forceRefreshInput">
      <label for="forceRefreshInput">출석부 새로고침 (엑셀을 방금 수정했다면 체크)</label>
    </div>
    <div class="button-row no-print">
      <button id="runBtn" onclick="run()">좌석 자동배치 실행</button>
      <button class="secondary" id="printBtn" onclick="window.print()" disabled>인쇄</button>
    </div>

    <div class="edit-toolbar no-print">
  <button id="editBtn" class="secondary" onclick="startEdit()" disabled>✋ 수동 좌석조정</button>
  <button id="resetEditBtn" class="secondary" onclick="resetEdit()" disabled>↩ 자동배치로 되돌리기</button>
  <button id="finishEditBtn" onclick="finishEdit()" disabled>✅ 조정 완료</button>
</div>
<div id="editStatus" class="edit-status no-print"></div>
<div id="result" style="margin-top:20px;"></div>
  </div>

  
<script>
const API_URL = "https://hcss-backend.onrender.com/api/allocate";

let serverRows = null;
let manualRows = null;
let editing = false;
let dragSource = null;
let pointerSource = null;
let longPressTimer = null;
let currentMeta = null;
let savedLayoutAt = null;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cloneRows(rows){
  return (rows || []).map(row => (row || []).map(x => [x[0],x[1]]));
}

function setEditButtons(hasData){
  const a=document.getElementById("editBtn");
  const b=document.getElementById("resetEditBtn");
  const c=document.getElementById("finishEditBtn");
  if(a) a.disabled=!hasData;
  if(b) b.disabled=!hasData;
  if(c) c.disabled=!editing;
}

function status(msg,on=true){
  const el=document.getElementById("editStatus");
  el.textContent=msg;
  el.classList.toggle("on",on);
}

/*
 * 서버의 rows는 실제 좌석 순서(B-A-S-T / B-T 등)를 그대로 사용한다.
 * 따라서 자동배치 결과의 물리 좌우 방향을 다시 뒤집지 않는다.
 */
function countRows(rows){
  const out=[];
  (rows||[]).forEach(row=>{
    const c={S:0,A:0,T:0,B:0,ORG:0};
    (row||[]).forEach(item=>{ if(item?.[0] in c) c[item[0]]++; });
    out.push(c);
  });
  return out;
}

function buildCountSummary(data, rowsForDisplay=null){
  const p=data.attending_by_part||{};
  const rc=(rowsForDisplay ? countRows(rowsForDisplay) : (data.row_part_counts||[]));
  let h=`<div class="info-box"><p style="margin:0 0 6px 0"><strong>📅 기준 날짜:</strong> ${esc(data.date||data.date_str||'')}</p>`;
  const total=Number(data.attending_count||0);
  h+=`<p style="margin:0 0 8px 0"><strong>👥 총 출석:</strong> ${total}명 + 오르간 1석 = ${total+1}명</p>`;
  const partText=[['S','소프라노'],['A','알토'],['T','테너'],['B','베이스']]
    .map(([k,label])=>`${label} ${Number(p[k]||0)}명`).join(' · ');
  h+=`<p style="margin:0 0 8px 0"><strong>파트 출석:</strong> ${partText}</p>`;
  h+=`<div><strong>열별 배치:</strong><div style="margin-top:5px">`;
  rc.forEach((r,i)=>{
    const parts=[];
    [['S','S'],['A','A'],['T','T'],['B','B']].forEach(([k,label])=>{
      const n=Number(r?.[k]||0); if(n>0) parts.push(`${label}${n}`);
    });
    const organ=Number(r?.ORG||0);
    if(organ && i===2) parts.push('O1');
    const totalRow=parts.reduce((sum,x)=>sum + (x==='O1'?1:(parseInt(x.slice(1))||0)),0);
    h+=`<div style="margin:2px 0">${i+1}열 ${parts.join(' · ')} <strong>= ${totalRow}명</strong></div>`;
  });
  h+=`</div></div></div>`;
  return h;
}


function renderRowsHtml(rows, isEditing){
  let html='<div class="drag-stage">';
  (rows||[]).forEach((row,r)=>{
    const rowCount=(row||[]).length;
    html += `<div class="drag-row"><div class="drag-row-title">[${r+1}열] (${rowCount}명)</div><div class="drag-zone" data-row="${r}">`;
    (row||[]).forEach((item,i)=>{
      const part=item[0], name=item[1], org=part==="ORG";
      html += `<div class="drag-seat ${esc(part)} ${org?'':'draggable'}" data-row="${r}" data-index="${i}" ${org?'':'draggable="true"'}>${org ? 'O1' : esc(name)}</div>`;
    });
    html += '</div></div>';
  });
  html += `<div class="drag-help">${isEditing
    ? '이름을 드래그하여 같은 파트뿐 아니라 다른 파트 좌석과도 서로 위치를 교환할 수 있습니다. 오르간 O1은 고정입니다.'
    : '자동배치 결과입니다. 「수동 좌석조정」에서 이름을 드래그하여 다른 파트와도 위치를 교환할 수 있습니다.'}</div></div>`;
  return html;
}

function renderEditable(rows){
  const result=document.getElementById("result");
  if(!rows) return;
  const meta=currentMeta||{};
  const data={
    date:meta.date_str||document.getElementById("dateInput").value,
    attending_count:meta.attending_count||0,
    attending_by_part:meta.attending_by_part||{},
    row_part_counts:meta.row_part_counts||[]
  };
  result.innerHTML=buildCountSummary(data, rows)+renderRowsHtml(rows, editing);
  if(editing) bindDnD();
}


function getItem(r,i){
  return manualRows?.[r]?.[i] || null;
}

function validMove(fr,fi,tr,ti){
  const a=getItem(fr,fi), b=getItem(tr,ti);
  if(!a || !b) return false;
  if(a[0]==="ORG" || b[0]==="ORG") return false;
  return !(fr===tr && fi===ti);
}

function clearHighlights(){
  document.querySelectorAll(".drag-seat").forEach(el=>{
    el.classList.remove("valid-target","dragging");
  });
}

function highlight(){
  clearHighlights();
  if(!dragSource) return;
  document.querySelectorAll(".drag-seat").forEach(el=>{
    const r=+el.dataset.row, i=+el.dataset.index;
    if(validMove(dragSource.r,dragSource.i,r,i))
      el.classList.add("valid-target");
  });
}

function exchange(fr,fi,tr,ti){
  if(!validMove(fr,fi,tr,ti)){
    status("⚠ 오르간 O1을 제외한 좌석끼리 위치를 교환할 수 있습니다.");
    return;
  }
  const tmp=manualRows[fr][fi];
  manualRows[fr][fi]=manualRows[tr][ti];
  manualRows[tr][ti]=tmp;
  renderEditable(manualRows);
  status("✏️ 좌석을 교환했습니다.");
}

function bindDnD(){
  document.querySelectorAll('.drag-seat[draggable="true"]').forEach(el=>{
    el.addEventListener("dragstart",e=>{
      dragSource={r:+el.dataset.row,i:+el.dataset.index};
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain","HCSS");
      highlight();
    });
    el.addEventListener("dragend",()=>{
      clearHighlights();
      dragSource=null;
    });
    el.addEventListener("dragover",e=>{
      if(!dragSource) return;
      const r=+el.dataset.row,i=+el.dataset.index;
      if(validMove(dragSource.r,dragSource.i,r,i)){
        e.preventDefault();
        el.classList.add("valid-target");
      }
    });
    el.addEventListener("drop",e=>{
      e.preventDefault();
      if(!dragSource) return;
      const from={...dragSource};
      exchange(from.r,from.i,+el.dataset.row,+el.dataset.index);
      clearHighlights();
      dragSource=null;
    });

    // 모바일: 길게 누른 뒤 목적지 좌석을 터치하면 교환
    el.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse") return;
      pointerSource={r:+el.dataset.row,i:+el.dataset.index};
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(()=>{
        dragSource=pointerSource;
        highlight();
        status("📱 이동할 좌석을 터치하세요. 다른 파트도 가능합니다.");
      },350);
    });
  });
}

document.addEventListener("pointerup",e=>{
  clearTimeout(longPressTimer);
  if(e.pointerType==="mouse" || !dragSource) return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.(".drag-seat");
  const from={...dragSource};
  if(target) exchange(from.r,from.i,+target.dataset.row,+target.dataset.index);
  clearHighlights();
  dragSource=null;
  pointerSource=null;
});

async function saveLayoutToServer(){
  if(!manualRows || !currentMeta) return;
  const response=await fetch("https://hcss-backend.onrender.com/api/layout/save",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
        date_str:currentMeta.date_str,total_seats:currentMeta.total_seats,rows:manualRows,
        attending_count:currentMeta.attending_count||0,
        attending_by_part:currentMeta.attending_by_part||{},
        row_part_counts:countRows(manualRows)
      })
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.detail||"수동배치 저장 실패");
  savedLayoutAt=data.saved_at||null;
  return data;
}

async function fetchWithTimeout(url, options={}, timeoutMs=20000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url,{...options,signal:controller.signal});
  }finally{ clearTimeout(timer); }
}

async function fetchExactSavedLayout(date, seats){
  const response=await fetchWithTimeout("https://hcss-backend.onrender.com/api/layout/load",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date_str:date,total_seats:seats,rows:[]})
  },20000);
  const data=await response.json();
  if(response.ok && data.status==="success" && data.rows && data.rows.length){
    return data;
  }
  return null; // 저장된 배치 없음(정상적인 "없음" 상태 - 오류 아님)
}

function showSavedLayout(date, seats, data){
  currentMeta={date_str:date,total_seats:seats,
    attending_count:data.attending_count, attending_by_part:data.attending_by_part,
    row_part_counts:data.row_part_counts};
  serverRows=cloneRows(data.rows); manualRows=cloneRows(data.rows); editing=false; savedLayoutAt=data.saved_at||null;
  setEditButtons(true);
  const result=document.getElementById("result");
  result.innerHTML=buildCountSummary({
    date:date, attending_count:data.attending_count||0,
    attending_by_part:data.attending_by_part||{}, row_part_counts:data.row_part_counts||[]
  }, serverRows)+renderRowsHtml(serverRows,false);
}

async function loadSavedLayout(){
  const date=document.getElementById("dateInput").value;
  const seats=parseInt(document.getElementById("seatsInput").value)||67;
  const result=document.getElementById("result");
  if(!date) return;
  result.innerHTML="<p style='color:#6c757d;font-weight:bold;'>☁️ 저장된 수동배치를 확인하는 중입니다...<br><small>Render 서버가 잠들어 있으면 잠시 걸릴 수 있습니다.</small></p>";
  try{
    const data=await fetchExactSavedLayout(date, seats);
    if(data){
      showSavedLayout(date, seats, data);
      status(`☁️ 저장된 수동배치를 불러왔습니다${savedLayoutAt?` · ${new Date(savedLayoutAt).toLocaleString("ko-KR")}`:""}`);
    }else{
      result.innerHTML="<p style='color:#6c757d;'>저장된 수동배치가 없습니다. <strong>좌석 자동배치 실행</strong>을 눌러 주세요.</p>";
    }
  }catch(e){
    const msg=e.name==="AbortError" ? "저장된 배치 확인 시간이 초과되었습니다." : e.message;
    result.innerHTML=`<p style='color:#b02a37;'><strong>저장배치 확인:</strong> ${esc(msg)}<br><small>자동배치를 실행하면 다시 정상적으로 확인할 수 있습니다.</small></p>`;
    console.log("saved layout load failed",e);
  }
}

function startEdit(){
  if(!serverRows) return;
  editing=true;
  manualRows=cloneRows(serverRows);
  setEditButtons(true);
  status("✋ 수동 좌석조정 모드입니다.");
  renderEditable(manualRows);
}

function resetEdit(){
  if(!serverRows) return;
  editing=true;
  manualRows=cloneRows(serverRows);
  status("↩ 자동배치 결과로 되돌렸습니다.");
  renderEditable(manualRows);
}

async function finishEdit(){
  if(!manualRows) return;
  try{
    await saveLayoutToServer();
    editing=false;
    serverRows=cloneRows(manualRows);
    currentMeta.row_part_counts=countRows(serverRows);
    setEditButtons(true);
    status(`✅ 수동 좌석조정 완료 · Google에 저장되었습니다${savedLayoutAt?` (${new Date(savedLayoutAt).toLocaleString("ko-KR")})`:""}`);
    renderEditable(serverRows);
  }catch(e){ status(`❌ 저장 실패: ${e.message}`); }
}

async function run(){
  const resultDiv=document.getElementById("result");
  const runBtn=document.getElementById("runBtn");
  const printBtn=document.getElementById("printBtn");
  const selectedDate=document.getElementById("dateInput").value;
  const totalSeats=parseInt(document.getElementById("seatsInput").value)||67;
  const forceRefresh=document.getElementById("forceRefreshInput").checked;

  localStorage.setItem("lastTotalSeats",totalSeats);
  runBtn.disabled=true;
  printBtn.disabled=true;
  setEditButtons(false);
  status("",false);

  // 이 날짜+정원에 저장된 「조정 완료」본이 정확히 있으면(그리고 "출석부 새로고침"을
  // 요청한 게 아니라면), 자동배치를 다시 계산하지 않고 그 저장본을 그대로 보여준다.
  // (이전에는 이 확인 없이 항상 새로 자동배치를 실행해서, 저장해둔 수동조정 결과가
  //  아니라 알고리즘이 새로 계산한 - 사실상 초기화된 - 결과가 나오는 문제가 있었다.
  //  자동배치는 과거 기록을 "부드러운 참고자료"로만 반영할 뿐 이 날짜의 저장본을
  //  그대로 재현하는 게 아니기 때문이다.)
  if(!forceRefresh){
    resultDiv.innerHTML="<p style='color:#6c757d;font-weight:bold;'>☁️ 저장된 수동배치가 있는지 확인하는 중입니다...</p>";
    try{
      const saved=await fetchExactSavedLayout(selectedDate, totalSeats);
      if(saved){
        showSavedLayout(selectedDate, totalSeats, saved);
        status(`☁️ 저장된 수동배치를 불러왔습니다(자동배치를 다시 계산하지 않았습니다)${savedLayoutAt?` · ${new Date(savedLayoutAt).toLocaleString("ko-KR")}`:""}. 새로 계산하려면 "출석부 새로고침"을 체크한 뒤 다시 실행하세요.`);
        runBtn.disabled=false;
        printBtn.disabled=false;
        return;
      }
    }catch(e){
      console.log("saved layout check failed, falling back to auto-allocate",e);
      // 확인 자체가 실패한 경우엔 그냥 아래에서 자동배치를 새로 실행한다
    }
  }

  resultDiv.innerHTML="<p style='color:#007bff;font-weight:bold;'>구글 시트에서 출석부를 읽어 좌석을 배치 중입니다...</p>";

  try{
    const response=await fetchWithTimeout(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        date_str:selectedDate,
        total_seats:totalSeats,
        balance_rule:"1=2>=3>=4",
        force_refresh:forceRefresh
      })
    });

    const data=await response.json();
    if(!response.ok) throw new Error(data.detail || "알 수 없는 서버 오류");

    serverRows=cloneRows(data.rows);
    manualRows=cloneRows(data.rows);
    editing=false;
    currentMeta={date_str:selectedDate,total_seats:totalSeats,
      attending_count:data.attending_count||0,
      attending_by_part:data.attending_by_part||{},
      row_part_counts:data.row_part_counts||countRows(data.rows)};
    savedLayoutAt=null;

    const p=data.attending_by_part||{};
    const totalWithOrgan=(data.attending_count||0)+1;
    renderEditable(serverRows);

    // 기존 프로그램의 진단 정보
    if(data.code_version || data.data_source){
      let diag="";
      if(data.data_source) diag += `${esc(data.data_source)} (${data.refresh_mode==="force"?"새로고침":"캐시"})`;
      if(data.code_version) diag += (diag?" · ":"")+`서버 버전: ${esc(data.code_version)}`;
      resultDiv.insertAdjacentHTML("beforeend",
        `<p class="no-print" style="margin-top:10px;font-size:10px;color:#adb5bd;text-align:right">${diag}</p>`);
    }

    printBtn.disabled=false;
    setEditButtons(true);
    const seed=data.saved_layout_reference?.used ? ` · 지난 조정배치 참고(${data.saved_layout_reference.date||'최근'})` : '';
    status(`자동배치 완료${seed}. 필요하면 「수동 좌석조정」을 눌러 드래그하세요.`);
  }catch(error){
    resultDiv.innerHTML=`<p style="color:red"><strong>오류:</strong> ${esc(error.message)}</p>`;
    setEditButtons(false);
  }finally{
    runBtn.disabled=false;
    runBtn.textContent="좌석 자동배치 실행";
  }
}
document.addEventListener("DOMContentLoaded",()=>{
  const d=document.getElementById("dateInput");
  const seats=document.getElementById("seatsInput");
  if(!d.value){ const x=new Date(); d.value=x.toISOString().slice(0,10); }
  if(!seats.value) seats.value=localStorage.getItem("lastTotalSeats")||"67";
  loadSavedLayout();
});
</script>

</body>
</html>
