<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 650px; margin: auto; }
    
    /* 입력 양식 스타일 */
    .form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .input-label { font-size: 14px; font-weight: bold; color: #495057; white-space: nowrap; }
    input[type="date"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 140px; }
    input[type="number"] { padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 70px; text-align: center; }
    button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; flex: 1; min-width: 180px; }
    
    .info-box { background: #e7f5ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #74c0fc; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.8; }
    .seat-row h4 { margin: 0 0 8px 0; color: #333; font-size: 15px; }
    
    /* 파트별 색상 */
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #e83e8c; font-weight: bold; }
    
    .person-tag { display: inline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group">
      <input type="date" id="dateInput">
      <span class="input-label">찬양대석 정원</span>
      <input type="number" id="seatsInput" placeholder="67">
    </div>
    <button onclick="run()">좌석 자동배치 실행</button>
    
    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    // 오늘 날짜 기본 설정
    document.getElementById("dateInput").value = new Date().toLocaleDateString("en-CA");
    
    // 저장된 찬양대석 정원 불러오기 (기본값 67)
    const savedSeats = localStorage.getItem("lastTotalSeats");
    document.getElementById("seatsInput").value = savedSeats ? savedSeats : "67";

    const API_URL = "https://hcss-backend.onrender.com/api/allocate";

    async function run() {
      const resultDiv = document.getElementById("result");
      const selectedDate = document.getElementById("dateInput").value;
      const seatsInputVal = document.getElementById("seatsInput").value;
      const totalSeats = parseInt(seatsInputVal) || 67;

      localStorage.setItem("lastTotalSeats", totalSeats);

      resultDiv.innerHTML = "<p style='color:#007bff; font-weight:bold;'>구글 드라이브에서 출석부를 읽어 좌석을 배치 중입니다...</p>";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date_str: selectedDate,
            total_seats: totalSeats,
            // 백엔드 균동 배정 규칙 전달 (1열=2열>=3열>=4열, 편차 1이내)
            balance_rule: "1=2>=3>=4"
          })
        });

        const data = await response.json();

        if (response.ok) {
          const p = data.attending_by_part || {};
          
          let html = `
            <div class="info-box">
              <p style="margin:0 0 5px 0;"><strong>📅 기준 날짜:</strong> ${data.date}</p>
              <p style="margin:0;"><strong>👥 출석인원 :</strong> 총 ${data.attending_count}명 (S ${p.S || 0}, A ${p.A || 0}, T ${p.T || 0}, B ${p.B || 0})</p>
            </div>
          `;

          data.rows.forEach((row, idx) => {
            const counts = data.row_part_counts ? data.row_part_counts[idx] : {};
            
            const partParts = [];
            if (counts.B > 0) partParts.push(`B ${counts.B}명`);
            if (counts.T > 0) partParts.push(`T ${counts.T}명`);
            if (counts.A > 0) partParts.push(`A ${counts.A}명`);
            if (counts.S > 0) partParts.push(`S ${counts.S}명`);
            if (counts.ORG > 0) partParts.push(`오르간 1명`);

            const headerText = `[${idx + 1}열] ${partParts.join(', ')} (합 ${row.length}명)`;

            html += `<div class="seat-row"><h4>${headerText}</h4>`;
            
            if (row.length === 0) {
              html += `<span style="color:#888;">배치된 인원이 없습니다.</span>`;
            } else {
              let rowHtml = "";
              let currentPart = null;

              row.forEach((item, itemIdx) => {
                let part = item[0];
                const name = item[1];

                // 파트 변경 시 [파트명] 출력
                if (part !== "" && part !== currentPart) {
                  currentPart = part;
                  if (itemIdx > 0) rowHtml += " ";
                  const partLabel = part === "ORG" ? "[ORG]" : `[${part}]`;
                  rowHtml += `<span class="person-tag ${part}">${partLabel}</span> `;
                }

                rowHtml += `<span class="person-tag ${currentPart}">${name}</span>`;

                // 같은 파트 내 구분자(,) 추가
                if (itemIdx < row.length - 1) {
                  const nextPart = row[itemIdx + 1][0];
                  if (nextPart === "" || nextPart === currentPart) {
                    rowHtml += ", ";
                  }
                }
              });

              html += rowHtml;
            }
            html += `</div>`;
          });

          // 성도석 표시
          const sungdoseokList = [];
          if (data.sungdoseok && data.sungdoseok.A) {
            sungdoseokList.push(...data.sungdoseok.A);
          } else if (data.leftover && data.leftover.A) {
            sungdoseokList.push(...data.leftover.A);
          }

          if (sungdoseokList.length > 0) {
            const sungdoseokTags = sungdoseokList.map(name => `<span class="person-tag A">${name}</span>`);
            html += `<div class="seat-row" style="background:#fff3bf;"><h4 style="color:#d97706;">🪑 성도석</h4>`;
            html += `<span class="person-tag A">[A]</span> ` + sungdoseokTags.join(", ");
            html += `</div>`;
          }

          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = `<p style="color:red;"><strong>오류 발생:</strong> ${data.detail || "알 수 없는 오류"}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p style="color:red;"><strong>통신 에러:</strong> ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
