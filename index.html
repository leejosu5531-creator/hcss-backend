<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할렐루야 찬양대 좌석 배치</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 15px; background: #f8f9fa; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; flex: 1; }
    .seat-row { margin-top: 12px; padding: 12px; background: #f1f3f5; border-radius: 8px; line-height: 1.6; }
    .S { color: #d9534f; font-weight: bold; }
    .A { color: #28a745; font-weight: bold; }
    .T { color: #007bff; font-weight: bold; }
    .B { color: #6f42c1; font-weight: bold; }
    .ORG { color: #fd7e14; font-weight: bold; }
    .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 6px; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎵 할렐루야 찬양대 좌석 배치</h2>
    <div class="form-group">
      <input type="date" id="dateInput" style="flex:2;">
      <input type="number" id="seatsInput" value="67" style="flex:1;">
    </div>
    <button onclick="run()">좌석 자동배치 실행</button>
    
    <div id="result" style="margin-top:20px;"></div>
  </div>

  <script>
    // 페이지를 열 때 오늘 날짜(YYYY-MM-DD)를 기본값으로 설정
    document.getElementById("dateInput").value = new Date().toLocaleDateString("en-CA");
    
    const API_URL = "https://hcss-backend.onrender.com/api/allocate";

    async function run() {
      const resDiv = document.getElementById('result');
      resDiv.innerHTML = "<p>⏳ 출석부를 확인하고 배치 중입니다...</p>";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date_str: document.getElementById('dateInput').value,
            total_seats: parseInt(document.getElementById('seatsInput').value)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "알 수 없는 오류가 발생했습니다.");
        }

        // 배치 결과 화면 출력
        let html = `<p><b>날짜:</b> ${data.date} | <b>출석 인원:</b> ${data.attending_count}명</p>`;
        
        if (data.rows && data.rows.length > 0) {
          data.rows.forEach((row, idx) => {
            html += `<div class="seat-row"><b>${idx + 1}열:</b> ${row.join(', ')}</div>`;
          });
        }

        if (data.leftover && data.leftover.length > 0) {
          html += `<div class="seat-row" style="background:#fff3cd;"><b>남은 인원:</b> ${data.leftover.join(', ')}</div>`;
        }

        resDiv.innerHTML = html;

      } catch (err) {
        resDiv.innerHTML = `<div class="error-msg">❌ <b>오류 발생:</b> ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
